<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles/shared.css"><link rel="stylesheet" href="editor.css"><link rel="stylesheet" href="branding.css"><title>Megamendung Cookies — Editor</title></head><body><header><div><h1><img class="brand-icon" src="../assets/icons/32.png" alt=""> Megamendung Cookies <span class="muted">/ Editor</span></h1><div id="summary" class="muted"></div></div><div class="toolbar"><label class="field">Tema<select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><button id="refresh">Refresh</button></div></header><main>
<section class="toolbar modes" aria-label="Cakupan cookies"><label><input type="radio" name="mode" value="tab" checked> Tab aktif</label><label><input type="radio" name="mode" value="domain"> Domain</label><input id="domainInput" placeholder="example.com" aria-label="Domain"><label><input type="radio" name="mode" value="all"> Semua domain</label><button id="loadDomain">Tampilkan</button><label>Cookie store<select id="store"></select></label><label>Refresh setelah import<select id="refreshScope"><option value="active">Tab aktif saja</option><option value="domain">Semua tab domain sama</option></select></label></section>
<section class="toolbar filters"><input id="search" type="search" placeholder="Cari nama, value, domain…" aria-label="Cari"><label><input type="checkbox" id="secureFilter"> Secure</label><label><input type="checkbox" id="httpOnlyFilter"> HttpOnly</label><label><input type="checkbox" id="sessionFilter"> Session</label><label><input type="checkbox" id="mask" checked> Sembunyikan value</label><span id="groupCount" class="muted"></span></section>
<section class="actions toolbar"><button id="add">Tambah cookie</button><button id="deleteSelected" class="danger">Hapus terpilih</button><button id="deleteDomain" class="danger">Hapus semua domain…</button><select id="exportFormat" aria-label="Format ekspor"><option value="json">JSON cookies (array)</option><option value="cookie-brother">Megamendung JSON</option><option value="netscape">Netscape TXT</option><option value="cookie-header">Cookie header</option></select><details class="export-menu action-export"><summary>Export</summary><button id="copyExport">Salin ke clipboard</button><button id="downloadExport">Unduh file</button></details><button id="importFocus" class="action-import">Import cookies</button></section>
<div class="table-container"><table><thead><tr><th><input type="checkbox" id="selectAll" aria-label="Pilih semua"></th><th data-sort="name">Nama</th><th>Value</th><th data-sort="domain">Domain</th><th data-sort="path">Path</th><th data-sort="expirationDate">Expiry</th><th data-sort="secure">S</th><th data-sort="httpOnly">H</th><th data-sort="sameSite">SameSite</th><th>Frame</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" class="muted" hidden>Tidak ada cookies.</p></div>
<div class="lower"><section class="panel"><h2 id="formTitle">Cookie terpilih</h2><form id="cookieForm"><input type="hidden" id="original"><div class="form-grid"><label class="field">Nama<input id="fName" required></label><label class="field">Value<input id="fValue"></label><label class="field">Domain<input id="fDomain" required></label><label class="field">Path<input id="fPath" value="/"></label><label class="field">SameSite<select id="fSameSite"><option value="unspecified">Unspecified</option><option value="no_restriction">None</option><option value="lax">Lax</option><option value="strict">Strict</option></select></label><label class="field">Expiry (detik epoch; kosong = session)<input id="fExpiry" type="number" step="any"></label></div><div class="toolbar flags"><label><input type="checkbox" id="fHostOnly"> Host-only</label><label><input type="checkbox" id="fSecure"> Secure</label><label><input type="checkbox" id="fHttpOnly"> HttpOnly</label></div><div class="toolbar"><button class="primary" type="submit">Simpan cookie</button><button type="button" id="clearForm">Kosongkan</button></div><p id="formError" class="error" role="alert"></p></form></section>
<section class="panel" id="importPanel"><h2>Import cookies</h2><div class="toolbar"><input type="file" id="file" aria-label="Pilih file cookie" accept=".json,.txt,.har,.cookies,text/plain,application/json"><select id="importFormat" aria-label="Format input"><option value="auto">Deteksi otomatis</option><option value="cookie-brother">Megamendung JSON</option><option value="json">JSON array / storageState</option><option value="netscape">Netscape cookies.txt</option><option value="cookie-header">Cookie header</option><option value="set-cookie">Set-Cookie</option><option value="har">HAR</option><option value="chrome-sqlite">Chrome SQLite JSON</option></select></div><textarea id="importText" placeholder="Paste teks cookie atau letakkan file di sini…" aria-label="Teks untuk diimpor"></textarea><div class="toolbar"><label>Konflik<select id="conflict"><option value="overwrite">Timpa</option><option value="skip">Lewati yang sudah ada</option></select></label><label><input type="checkbox" id="activeDomainOnly"> Hanya domain tab aktif</label><button id="preview" class="primary action-import">Pratinjau</button></div><div id="previewArea" hidden><p id="previewSummary"></p><div class="preview-table"><table><thead><tr><th>Nama</th><th>Domain</th><th>Status / peringatan</th></tr></thead><tbody id="previewRows"></tbody></table></div><button id="applyImport" class="primary action-import">Terapkan import</button></div></section></div></main><div id="toast" class="toast" hidden></div><script type="module" src="editor.js"></script></body></html>
