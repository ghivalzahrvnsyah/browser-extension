<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../styles/shared.css"><link rel="stylesheet" href="popup.css"><title>Cookie Brother</title></head><body><header><strong>🍪 Cookie Brother</strong><div class="toolbar"><select id="theme" aria-label="Tema"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select><button id="openEditor">↗ Editor</button></div></header><section class="summary"><strong id="domain">Membaca tab…</strong><span id="count" class="muted"></span></section><input id="search" type="search" placeholder="Cari nama, value, domain…" aria-label="Cari cookies"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Domain · Frame</th><th>Flags</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" class="muted" hidden>Tidak ada cookie yang cocok.</p></div><footer><div class="toolbar"><button id="import">Import…</button><select id="exportFormat" aria-label="Format ekspor"><option value="json">JSON cookies (array)</option><option value="cookie-brother">Cookie Brother JSON</option><option value="netscape">Netscape TXT</option><option value="cookie-header">Cookie header</option></select><details class="export-menu"><summary>Export ▾</summary><button id="copyExport">Salin ke clipboard</button><button id="downloadExport">Unduh file</button></details><button id="deleteAll" class="danger">Hapus semua</button></div><label><input type="checkbox" id="autoRefresh"> Auto-refresh setelah import</label></footer>
<details id="importPanel"><summary>Import cookie</summary><div class="import-content"><div class="toolbar"><input type="file" id="file" accept=".json,.txt,.har,.cookies,text/plain,application/json"><select id="importFormat" aria-label="Format impor"><option value="auto">Deteksi otomatis</option><option value="cookie-brother">Cookie Brother JSON</option><option value="json">JSON array / storageState</option><option value="netscape">Netscape cookies.txt</option><option value="cookie-header">Cookie header</option><option value="set-cookie">Set-Cookie</option><option value="har">HAR</option><option value="chrome-sqlite">Chrome SQLite JSON</option></select></div><textarea id="importText" placeholder="Tempel teks cookie atau letakkan file di sini…" aria-label="Teks cookie untuk impor"></textarea><div class="toolbar"><select id="conflict" aria-label="Strategi konflik"><option value="overwrite">Timpa cookie duplikat</option><option value="skip">Lewati cookie duplikat</option></select><label><input type="checkbox" id="activeDomainOnly"> Hanya domain tab ini</label><button id="preview" class="primary">Pratinjau</button></div><div id="previewArea" hidden><p id="previewSummary"></p><div class="preview-table"><table><thead><tr><th>Nama</th><th>Domain</th><th>Catatan</th></tr></thead><tbody id="previewRows"></tbody></table></div><button id="applyImport" class="primary">Terapkan import</button></div></div></details><div id="toast" class="toast" hidden></div><script type="module" src="popup.js"></script></body></html>
